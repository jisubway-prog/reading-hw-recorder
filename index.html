<!DOCTYPE html>

<head>

<style>
  * { box-sizing: border-box; }
  body { font-family: 'Malgun Gothic', -apple-system, sans-serif; background:#f3f4f6; margin:0;

  .card { max-width:420px; margin:0 auto; background:#fff; border-radius:20px; padding:40px 28px;
          box-shadow:0 4px 16px rgba(0,0,0,0.08); text-align:center; }
  .icon { font-size:52px; margin-bottom:6px; }
  h1 { font-size:24px; margin:0 0 14px; color:#111827; }
  p { font-size:15px; color:#6b7280; line-height:1.7; margin:0 0 28px; }
  a.start-btn { display:block; background:#2563eb; color:#fff; text-decoration:none;
                border-radius:14px; padding:18px; font-size:18px; font-weight:700; }
  a.start-btn:active { background:#1d4ed8; }
  .hint { font-size:12px; color:#9ca3af; margin-top:18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📖</div>

    <a class="start-btn" href="https://script.google.com/macros/s/AKfycbyUeTE1sa7ahSFFMVdT4ErXMLyEx6_f6MMgxGRkap-KFDY2oevJofazFpBSsLv9GMAu0w/exec">🚀 숙제 시작하기</a>

  </div>
